<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{DESC}}">
  <title>{{TITLE}} - Droidspaces Docs</title>
  <meta property="og:title" content="{{TITLE}} - Droidspaces Docs">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Droidspaces">
  <meta property="og:image" content="https://www.droidspaces.org/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Droidspaces wordmark, the words Linux containers on Android, and a terminal starting an Ubuntu container">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} - Droidspaces Docs">
  <meta name="twitter:description" content="{{DESC}}">
  <meta name="twitter:image" content="https://www.droidspaces.org/assets/images/og-image.png">
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="application/ld+json">{{JSONLD}}</script>
  <script>(function(){const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
{{NAV}}
<div class="docs-layout">
  <button class="doc-breadcrumb" popovertarget="sidebar"><span class="icon" aria-hidden="true">menu</span>{{BREADCRUMB}}</button>
  <aside class="sidebar" id="sidebar" popover>
    <button class="icon-button sidebar-close" popovertarget="sidebar" popovertargetaction="hide" aria-label="Close navigation"><span class="icon" aria-hidden="true">close</span></button>
    <button class="search-open" type="button" hidden><span class="icon" aria-hidden="true">search</span>Search the docs<kbd>Ctrl K</kbd></button>
{{SIDEBAR}}
  </aside>
  <main id="main" class="docs-content">
    <article>
{{BODY}}
    </article>
    <p class="doc-edit"><a href="{{EDIT_URL}}" rel="noopener noreferrer"><span class="icon" aria-hidden="true">edit</span>Edit this page on GitHub</a></p>
{{DOC_NAV}}
  </main>
  <aside class="toc-column">
{{TOC}}
  </aside>
</div>
<dialog class="search-dialog" aria-label="Search the docs">
  <form method="dialog" class="search-form">
    <span class="icon" aria-hidden="true">search</span>
    <input type="search" class="search-input" placeholder="Search the docs" autocomplete="off" aria-label="Search the docs">
    <button class="icon-button" aria-label="Close search"><span class="icon" aria-hidden="true">close</span></button>
  </form>
  <ul class="search-results"></ul>
</dialog>
{{FOOTER}}
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/docs.js" defer></script>
</body>
</html>
